# OPNmesh control node — production compose.
#
# Brings up the control panel (Next.js UI + agent API), Prometheus,
# Alertmanager and Grafana on one Ubuntu VM. Every port comes from .env.local;
# nothing is hardcoded. The data plane never depends on this stack.
#
#   cp .env.example .env.local   # fill in ports + SMTP
#   docker compose up -d
name: opnmesh-control

services:
  control:
    build:
      context: ../..
      dockerfile: deploy/control-node/Dockerfile
    image: opnmesh-control
    restart: unless-stopped
    env_file: .env.local
    environment:
      OPNMESH_STATE_DIR: /var/lib/opnmesh/config
      OPNMESH_DATA_DIR: /var/lib/opnmesh/data
      OPNMESH_PROM_URL: http://prometheus:9090
      OPNMESH_AM_URL: http://alertmanager:9093
      # The UI talks to its own API half in-container.
      OPNMESH_CONTROL_URL: http://localhost:8080
    volumes:
      - opnmesh-config:/var/lib/opnmesh/config
      - opnmesh-data:/var/lib/opnmesh/data
      - opnmesh-releases:/var/lib/opnmesh/config/control/releases
    ports:
      # Admin UI (humans) on the configured web port.
      - "${OPNMESH_WEB_PORT:-443}:3000"
      # Agent-facing API + Prometheus scrape target (nodes pull from here).
      - "${OPNMESH_API_PORT:-8443}:8080"

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    volumes:
      - ../prometheus:/etc/prometheus:ro
      - opnmesh-prom:/prometheus
    ports:
      - "${OPNMESH_PROMETHEUS_PORT:-9090}:9090"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    env_file: .env.local
    volumes:
      - ../alertmanager:/etc/alertmanager:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    ports:
      - "${OPNMESH_ALERTMANAGER_PORT:-9093}:9093"

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    environment:
      GF_SERVER_HTTP_PORT: 3000
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - opnmesh-grafana:/var/lib/grafana
    ports:
      - "${OPNMESH_GRAFANA_PORT:-3001}:3000"

volumes:
  opnmesh-config:
  opnmesh-data:
  opnmesh-releases:
  opnmesh-prom:
  opnmesh-grafana:
