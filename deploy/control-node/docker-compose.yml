# OPNmesh control node — production compose.
#
# Brings up the control panel (Next.js UI + agent API), Prometheus,
# Alertmanager and Grafana on one Ubuntu VM. Every port comes from .env.local;
# nothing is hardcoded. The data plane never depends on this stack.
#
#   cp .env.example .env.local   # fill in ports + SMTP
#   docker compose up -d
name: opnmesh-control

services:
  control:
    build:
      context: ../..
      dockerfile: deploy/control-node/Dockerfile
    image: opnmesh-control
    restart: unless-stopped
    env_file: .env.local
    environment:
      OPNMESH_STATE_DIR: /var/lib/opnmesh/config
      OPNMESH_DATA_DIR: /var/lib/opnmesh/data
      # TLS is mandatory: node bearer tokens ride every poll.
      OPNMESH_TLS_CERT: /var/lib/opnmesh/tls/fullchain.pem
      OPNMESH_TLS_KEY: /var/lib/opnmesh/tls/privkey.pem
      OPNMESH_PROM_URL: http://prometheus:9090
      OPNMESH_AM_URL: http://alertmanager:9093
      # The UI talks to its own API half in-container.
      OPNMESH_CONTROL_URL: http://localhost:8080
    volumes:
      - opnmesh-config:/var/lib/opnmesh/config
      - opnmesh-data:/var/lib/opnmesh/data
      - opnmesh-releases:/var/lib/opnmesh/config/control/releases
      # Your certificate and key for the control node's hostname.
      - ./tls:/var/lib/opnmesh/tls:ro
    security_opt:
      - no-new-privileges:true
    ports:
      # Admin UI (humans) on the configured web port.
      - "${OPNMESH_WEB_PORT:-443}:3000"
      # Agent-facing API + Prometheus scrape target (nodes pull from here).
      - "${OPNMESH_API_PORT:-8443}:8080"

  # Prometheus, Alertmanager and Grafana bind to LOOPBACK only. They hold
  # mesh telemetry and can silence alerts; reach them over an SSH tunnel or a
  # reverse proxy you authenticate, never straight off the LAN.
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    user: "nobody"
    security_opt:
      - no-new-privileges:true
    volumes:
      - ../prometheus:/etc/prometheus:ro
      - opnmesh-prom:/prometheus
    ports:
      - "127.0.0.1:${OPNMESH_PROMETHEUS_PORT:-9090}:9090"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    env_file: .env.local
    user: "nobody"
    security_opt:
      - no-new-privileges:true
    volumes:
      - ../alertmanager:/etc/alertmanager:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    ports:
      - "127.0.0.1:${OPNMESH_ALERTMANAGER_PORT:-9093}:9093"

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      GF_SERVER_HTTP_PORT: 3000
      # Never leave Grafana on admin/admin.
      GF_SECURITY_ADMIN_PASSWORD: ${OPNMESH_GRAFANA_PASSWORD:?set OPNMESH_GRAFANA_PASSWORD in .env.local}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - opnmesh-grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:${OPNMESH_GRAFANA_PORT:-3001}:3000"

volumes:
  opnmesh-config:
  opnmesh-data:
  opnmesh-releases:
  opnmesh-prom:
  opnmesh-grafana:
