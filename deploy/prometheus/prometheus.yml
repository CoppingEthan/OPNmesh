# OPNmesh Prometheus configuration.
# Targets are generated per deployment; the simulation mounts a copy with the
# sim addresses. Ports come from configuration, never hardcoded defaults.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: gateways
    static_configs:
      - targets:
          - "198.51.100.10:9586"
        labels:
          node: site-a
      - targets:
          - "198.51.100.20:9586"
        labels:
          node: site-b
      - targets:
          - "198.51.100.30:9586"
        labels:
          node: site-c

  - job_name: control
    static_configs:
      - targets: ["198.51.100.50:8080"]
