# OPNmesh Prometheus configuration.
#
# Gateways are scraped over the MESH at their tunnel addresses, never at their
# WAN addresses: the exporter publishes peer public keys and traffic volumes,
# and binds to the tunnel IP only. The control target requires the admin
# credential, supplied from a file mounted alongside this config.
#
# Targets are per deployment; the simulation writes its own copy of this file.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: gateways
    static_configs:
      - targets: ["10.99.0.1:9586"]
        labels: { node: site-a }
      - targets: ["10.99.0.2:9586"]
        labels: { node: site-b }
      - targets: ["10.99.0.3:9586"]
        labels: { node: site-c }

  - job_name: control
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/admin.token
    static_configs:
      - targets: ["control:8080"]
