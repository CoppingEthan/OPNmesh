<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 130" width="560" height="130" role="img" aria-label="OPNmesh">
  <!-- Concept 6 — Ring of sites: three sites on one ring, every one tunnelled to every other. No hub. -->
  <g transform="translate(64 66)">
    <!-- Ring as bold as the wordmark's stems (~14 px at this size), in the same green as "PN". -->
    <g fill="none" stroke="#3fb28c" stroke-width="14" stroke-linecap="round">
      <!-- 292° → 8° (right), 52° → 128° (bottom), 172° → 248° (left): ±22° clear of each site -->
      <path d="M 11.99 -29.67 A 32 32 0 0 1 31.69 4.45"/>
      <path d="M 19.70 25.22 A 32 32 0 0 1 -19.70 25.22"/>
      <path d="M -31.69 4.45 A 32 32 0 0 1 -11.99 -29.67"/>
    </g>
    <!-- Every site to every other: the mesh, a shade lighter than the ring. -->
    <g stroke="#5ac5a1" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="-32" x2="27.71" y2="16"/>
      <line x1="27.71" y1="16" x2="-27.71" y2="16"/>
      <line x1="-27.71" y1="16" x2="0" y2="-32"/>
    </g>
    <!-- The sites, solid, sitting on the ring. -->
    <g fill="#5ac5a1">
      <circle cx="0" cy="-32" r="9.5"/>
      <circle cx="27.71" cy="16" r="9.5"/>
      <circle cx="-27.71" cy="16" r="9.5"/>
    </g>
  </g>
  <text x="112" y="95" font-family="'Segoe UI Variable Display', 'Segoe UI', Inter, system-ui, sans-serif" font-size="86" font-weight="700" letter-spacing="-3">
    <tspan fill="#3fb28c">PN</tspan><tspan fill="#16211d">mesh</tspan>
  </text>
</svg>
