name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  no-secrets:
    name: No key material in the repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Grep for private keys and tokens
        run: |
          set -e
          if git grep -nE -- '-----BEGIN (RSA |EC |OPENSSH |)PRIVATE KEY-----' -- ':!*.md' ; then echo "private key material found"; exit 1; fi
          if git grep -nE 'PrivateKey = [A-Za-z0-9+/]{43}=' -- ':!test/golden' ':!*.md' ; then echo "WireGuard private key found"; exit 1; fi
          echo "clean"

  unit:
    name: Unit and API tests (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx cross-env OPNMESH_STANDALONE=1 NEXT_TELEMETRY_DISABLED=1 npx next build
      - name: UI smoke test against the standalone server (what the image runs)
        run: node scripts/ui-smoke.mjs --standalone

  agent:
    name: Gateway agent (Go)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: agent/go.sum
      - run: cd agent && go mod tidy && test -z "$(gofmt -l .)" && go vet ./... && go test ./...
      - name: Known vulnerabilities in the agent and the Go standard library
        run: cd agent && go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - run: cd agent && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/opnmesh-gw .

  deploy:
    name: Controller deployment and a real gateway (installer, private CA, systemd, upgrade)
    runs-on: ubuntu-24.04
    needs: [unit, agent]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Build the controller image
        run: docker build -t opnmesh:ci .
      - name: Run the controller installer against the local image
        env:
          OPNMESH_RAW_BASE: file://${{ github.workspace }}/deploy/controller
          OPNMESH_HTTP_PORT: "18080"
          OPNMESH_HTTPS_PORT: "18443"
        run: sudo -E bash deploy/controller/install.sh --dir /tmp/opnmesh-ci --url https://127.0.0.1:18443 --image opnmesh:ci
      - name: Kernel WireGuard available on the runner
        run: sudo modprobe wireguard && lsmod | grep -q wireguard
      - name: Smoke-test the deployment, then install, upgrade and remove a real gateway on this runner
        run: sudo -E "$(command -v node)" scripts/deploy-smoke.mjs --dir /tmp/opnmesh-ci --url https://127.0.0.1:18443 --gateway-test
      - name: Logs on failure
        if: failure()
        run: cd /tmp/opnmesh-ci && sudo docker compose logs --no-color --tail 100
      - name: Tear down
        if: always()
        run: cd /tmp/opnmesh-ci && sudo docker compose down -v || true

  simulation:
    name: Four-site simulation (Ubuntu 24.04 containers, kernel WireGuard)
    runs-on: ubuntu-24.04
    needs: [unit, agent]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Kernel WireGuard available on the runner
        run: sudo modprobe wireguard && lsmod | grep -q wireguard
      - name: Build the agent
        run: node scripts/agent-build.mjs
      - name: Start the simulation
        run: node scripts/sim.mjs up
      - name: Run the integration suite
        run: npm run sim:test
      - name: Logs on failure
        if: failure()
        run: docker compose -f sim/docker-compose.yml logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: node scripts/sim.mjs down
