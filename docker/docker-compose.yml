# Simulated mesh: three sites (gateway + LAN host each), a roaming client on
# the WAN, a control-node placeholder, and an optional traffic generator.
# Addresses mirror the reference topology; WAN uses TEST-NET-2.
name: opnmesh-sim

networks:
  wan:
    ipam:
      config:
        - subnet: 198.51.100.0/24
  lan-a:
    ipam:
      config:
        - subnet: 10.10.0.0/16
  lan-b:
    ipam:
      config:
        - subnet: 10.20.0.0/16
  lan-c:
    ipam:
      config:
        - subnet: 10.30.0.0/16
  lan-d:
    ipam:
      config:
        - subnet: 10.40.0.0/16

x-node: &node
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: opnmesh-sim-node
  cap_add:
    - NET_ADMIN
  restart: "no"

x-wg-node: &wg-node
  <<: *node
  devices:
    - /dev/net/tun

services:
  gw-a:
    <<: *wg-node
    container_name: opnmesh-gw-a
    sysctls:
      net.ipv4.ip_forward: 1
      # Runtime sysctl writes under /proc/sys/net/netfilter are read-only in
      # containers; set conntrack accounting at creation for the sim. On real
      # hosts the agent applies it from the generated sysctl.conf.
      net.netfilter.nf_conntrack_acct: 1
    networks:
      wan:
        ipv4_address: 198.51.100.10
      lan-a:
        ipv4_address: 10.10.0.2
    volumes:
      - ./state/site-a:/etc/opnmesh
    command: /opt/opnmesh/gateway.sh

  gw-b:
    <<: *wg-node
    container_name: opnmesh-gw-b
    sysctls:
      net.ipv4.ip_forward: 1
      # Runtime sysctl writes under /proc/sys/net/netfilter are read-only in
      # containers; set conntrack accounting at creation for the sim. On real
      # hosts the agent applies it from the generated sysctl.conf.
      net.netfilter.nf_conntrack_acct: 1
    networks:
      wan:
        ipv4_address: 198.51.100.20
      lan-b:
        ipv4_address: 10.20.0.2
    volumes:
      - ./state/site-b:/etc/opnmesh
    command: /opt/opnmesh/gateway.sh

  gw-c:
    <<: *wg-node
    container_name: opnmesh-gw-c
    sysctls:
      net.ipv4.ip_forward: 1
      # Runtime sysctl writes under /proc/sys/net/netfilter are read-only in
      # containers; set conntrack accounting at creation for the sim. On real
      # hosts the agent applies it from the generated sysctl.conf.
      net.netfilter.nf_conntrack_acct: 1
    networks:
      wan:
        ipv4_address: 198.51.100.30
      lan-c:
        ipv4_address: 10.30.0.2
    volumes:
      - ./state/site-c:/etc/opnmesh
    command: /opt/opnmesh/gateway.sh

  host-a:
    <<: *node
    container_name: opnmesh-host-a
    networks:
      lan-a:
        ipv4_address: 10.10.5.20
    environment:
      GW_IP: 10.10.0.2
    depends_on:
      - gw-a
    command: /opt/opnmesh/host.sh

  host-b:
    <<: *node
    container_name: opnmesh-host-b
    networks:
      lan-b:
        ipv4_address: 10.20.5.20
    environment:
      GW_IP: 10.20.0.2
    depends_on:
      - gw-b
    command: /opt/opnmesh/host.sh

  host-c:
    <<: *node
    container_name: opnmesh-host-c
    networks:
      lan-c:
        ipv4_address: 10.30.5.20
    environment:
      GW_IP: 10.30.0.2
    depends_on:
      - gw-c
    command: /opt/opnmesh/host.sh

  client:
    <<: *wg-node
    container_name: opnmesh-client
    networks:
      wan:
        ipv4_address: 198.51.100.100
    volumes:
      - ./state/clients/laptop:/etc/opnmesh
    depends_on:
      - gw-a
      - gw-b
      - gw-c
    command: /opt/opnmesh/client.sh

  control:
    # Plain Node image: runs the bundled dev control server. The data plane
    # must keep working when this container is killed. Like any host on a
    # site LAN, it reaches the mesh via its site's WireGuard gateway.
    image: node:22-alpine
    container_name: opnmesh-control
    restart: "no"
    cap_add:
      - NET_ADMIN
    networks:
      lan-a:
        ipv4_address: 10.10.7.10
      # The wan address stands in for the site router's port forward that
      # publishes the control node's web port for enrolment (§12).
      wan:
        ipv4_address: 198.51.100.50
    volumes:
      - ./state:/state
    environment:
      STATE_DIR: /state
      PORT: 8080
      # Simulation only: plain HTTP on an isolated docker network. A real
      # deployment sets OPNMESH_TLS_CERT/KEY instead and this refuses to start.
      OPNMESH_ALLOW_INSECURE_HTTP: "1"
      OPNMESH_ADMIN_TOKEN_FILE: /state/control/admin.token
      # Dead-man's switch heartbeat target (§10). In the sim it pings
      # Prometheus's health endpoint once the obs profile is up.
      OPNMESH_DEADMAN_URL: http://prometheus:9090/-/healthy
      OPNMESH_DEADMAN_INTERVAL_MS: 15000
    ports:
      - "18080:8080"
    depends_on:
      - gw-a
    command:
      [
        "sh",
        "-c",
        "ip route replace default via 10.10.0.2 && exec node /state/control/server.mjs",
      ]

  # --- enrolment profile: a factory-fresh fourth site (§12 end-to-end) ---

  gw-d:
    <<: *wg-node
    container_name: opnmesh-gw-d
    hostname: gw-d
    profiles:
      - enrol
    sysctls:
      net.ipv4.ip_forward: 1
      # Runtime sysctl writes under /proc/sys/net/netfilter are read-only in
      # containers; set conntrack accounting at creation for the sim. On real
      # hosts the agent applies it from the generated sysctl.conf.
      net.netfilter.nf_conntrack_acct: 1
    networks:
      wan:
        ipv4_address: 198.51.100.40
      lan-d:
        ipv4_address: 10.40.0.2
    environment:
      ENROL_SERVER: http://198.51.100.50:8080
      ENROL_TOKEN: ${ENROL_TOKEN:-}
    command: /opt/opnmesh/enrol-gateway.sh

  host-d:
    <<: *node
    container_name: opnmesh-host-d
    profiles:
      - enrol
    networks:
      lan-d:
        ipv4_address: 10.40.5.20
    environment:
      GW_IP: 10.40.0.2
    depends_on:
      - gw-d
    command: /opt/opnmesh/host.sh

  # --- observability profile (§13): Prometheus, Alertmanager, Grafana, and a
  # mailpit SMTP sink standing in for the operator's mail server ---

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: opnmesh-prometheus
    profiles:
      - obs
    cap_add:
      - NET_ADMIN
    # Simulation only: the container installs a mesh route at start, which
    # needs root. On a real control node the site router already routes the
    # mesh subnets, so the production compose runs Prometheus as nobody.
    user: root
    networks:
      wan:
      # Exporters bind to their tunnel addresses, so Prometheus scrapes over
      # the mesh like any other host at site-a.
      lan-a:
        ipv4_address: 10.10.7.20
    volumes:
      - ./state/obs/prometheus:/etc/prometheus
    depends_on:
      - gw-a
    ports:
      - "19090:9090"
    entrypoint:
      - /bin/sh
      - -c
      - "ip route replace 10.99.0.0/24 via 10.10.0.2 && exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: opnmesh-alertmanager
    profiles:
      - obs
    networks:
      - wan
    volumes:
      - ./state/obs/alertmanager:/etc/alertmanager
    # TEST-NET WAN addresses are technically public, so gossip clustering
    # finds no private advertise address and aborts startup — disable it.
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --cluster.listen-address=
    ports:
      - "19093:9093"

  mailpit:
    image: axllent/mailpit:v1.20
    container_name: opnmesh-mailpit
    profiles:
      - obs
    networks:
      - wan
    ports:
      - "18025:8025"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: opnmesh-grafana
    profiles:
      - obs
    networks:
      - wan
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ../deploy/grafana/provisioning:/etc/grafana/provisioning
      - ../deploy/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "13000:3000"

  traffic-gen:
    <<: *node
    container_name: opnmesh-traffic
    profiles:
      - traffic
    networks:
      lan-a:
        ipv4_address: 10.10.5.99
    environment:
      GW_IP: 10.10.0.2
    depends_on:
      - gw-a
    command: /opt/opnmesh/traffic.sh
