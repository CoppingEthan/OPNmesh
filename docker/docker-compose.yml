# Simulated mesh: three sites (gateway + LAN host each), a roaming client on
# the WAN, a control-node placeholder, and an optional traffic generator.
# Addresses mirror the reference topology; WAN uses TEST-NET-2.
name: opnmesh-sim

networks:
  wan:
    ipam:
      config:
        - subnet: 198.51.100.0/24
  lan-a:
    ipam:
      config:
        - subnet: 10.10.0.0/16
  lan-b:
    ipam:
      config:
        - subnet: 10.20.0.0/16
  lan-c:
    ipam:
      config:
        - subnet: 10.30.0.0/16
  lan-d:
    ipam:
      config:
        - subnet: 10.40.0.0/16

x-node: &node
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: opnmesh-sim-node
  cap_add:
    - NET_ADMIN
  restart: "no"

x-wg-node: &wg-node
  <<: *node
  devices:
    - /dev/net/tun

services:
  gw-a:
    <<: *wg-node
    container_name: opnmesh-gw-a
    sysctls:
      net.ipv4.ip_forward: 1
    networks:
      wan:
        ipv4_address: 198.51.100.10
      lan-a:
        ipv4_address: 10.10.0.2
    volumes:
      - ./state/site-a:/etc/opnmesh
    command: /opt/opnmesh/gateway.sh

  gw-b:
    <<: *wg-node
    container_name: opnmesh-gw-b
    sysctls:
      net.ipv4.ip_forward: 1
    networks:
      wan:
        ipv4_address: 198.51.100.20
      lan-b:
        ipv4_address: 10.20.0.2
    volumes:
      - ./state/site-b:/etc/opnmesh
    command: /opt/opnmesh/gateway.sh

  gw-c:
    <<: *wg-node
    container_name: opnmesh-gw-c
    sysctls:
      net.ipv4.ip_forward: 1
    networks:
      wan:
        ipv4_address: 198.51.100.30
      lan-c:
        ipv4_address: 10.30.0.2
    volumes:
      - ./state/site-c:/etc/opnmesh
    command: /opt/opnmesh/gateway.sh

  host-a:
    <<: *node
    container_name: opnmesh-host-a
    networks:
      lan-a:
        ipv4_address: 10.10.5.20
    environment:
      GW_IP: 10.10.0.2
    depends_on:
      - gw-a
    command: /opt/opnmesh/host.sh

  host-b:
    <<: *node
    container_name: opnmesh-host-b
    networks:
      lan-b:
        ipv4_address: 10.20.5.20
    environment:
      GW_IP: 10.20.0.2
    depends_on:
      - gw-b
    command: /opt/opnmesh/host.sh

  host-c:
    <<: *node
    container_name: opnmesh-host-c
    networks:
      lan-c:
        ipv4_address: 10.30.5.20
    environment:
      GW_IP: 10.30.0.2
    depends_on:
      - gw-c
    command: /opt/opnmesh/host.sh

  client:
    <<: *wg-node
    container_name: opnmesh-client
    networks:
      wan:
        ipv4_address: 198.51.100.100
    volumes:
      - ./state/clients/laptop:/etc/opnmesh
    depends_on:
      - gw-a
      - gw-b
      - gw-c
    command: /opt/opnmesh/client.sh

  control:
    # Plain Node image: runs the bundled dev control server. The data plane
    # must keep working when this container is killed. Like any host on a
    # site LAN, it reaches the mesh via its site's WireGuard gateway.
    image: node:22-alpine
    container_name: opnmesh-control
    restart: "no"
    cap_add:
      - NET_ADMIN
    networks:
      lan-a:
        ipv4_address: 10.10.7.10
      # The wan address stands in for the site router's port forward that
      # publishes the control node's web port for enrolment (§12).
      wan:
        ipv4_address: 198.51.100.50
    volumes:
      - ./state:/state
    environment:
      STATE_DIR: /state
      PORT: 8080
    ports:
      - "18080:8080"
    depends_on:
      - gw-a
    command:
      [
        "sh",
        "-c",
        "ip route replace default via 10.10.0.2 && exec node /state/control/server.mjs",
      ]

  # --- enrolment profile: a factory-fresh fourth site (§12 end-to-end) ---

  gw-d:
    <<: *wg-node
    container_name: opnmesh-gw-d
    hostname: gw-d
    profiles:
      - enrol
    sysctls:
      net.ipv4.ip_forward: 1
    networks:
      wan:
        ipv4_address: 198.51.100.40
      lan-d:
        ipv4_address: 10.40.0.2
    environment:
      ENROL_SERVER: http://198.51.100.50:8080
      ENROL_TOKEN: ${ENROL_TOKEN:-}
    command: /opt/opnmesh/enrol-gateway.sh

  host-d:
    <<: *node
    container_name: opnmesh-host-d
    profiles:
      - enrol
    networks:
      lan-d:
        ipv4_address: 10.40.5.20
    environment:
      GW_IP: 10.40.0.2
    depends_on:
      - gw-d
    command: /opt/opnmesh/host.sh

  traffic-gen:
    <<: *node
    container_name: opnmesh-traffic
    profiles:
      - traffic
    networks:
      lan-a:
        ipv4_address: 10.10.5.99
    environment:
      GW_IP: 10.10.0.2
    depends_on:
      - gw-a
    command: /opt/opnmesh/traffic.sh
