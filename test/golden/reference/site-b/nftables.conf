#!/usr/sbin/nft -f
# Generated by OPNmesh — do not edit; changes are overwritten on reconcile.
# node: site-b

table inet opnmesh {}
delete table inet opnmesh

table inet opnmesh {
  set clients {
    type ipv4_addr
    flags interval
    elements = { 10.99.1.0/24 }
  }

  set admin_sources {
    type ipv4_addr
    flags interval
    elements = { 10.10.5.0/24 }
  }

  set mgmt_destinations {
    type ipv4_addr
    flags interval
    elements = { 10.10.9.0/24, 10.30.9.0/24 }
  }

  counter cnt_site_a_to_site_b {}
  counter cnt_site_b_to_site_a {}
  counter cnt_site_b_to_site_c {}
  counter cnt_site_c_to_site_b {}

  chain forward {
    type filter hook forward priority filter; policy accept;

    # MTU: clamp TCP MSS to the tunnel path MTU in both directions.
    oifname "wg0" tcp flags syn tcp option maxseg size set rt mtu
    iifname "wg0" tcp flags syn tcp option maxseg size set rt mtu

    # Client isolation: clients reach in; nothing may open a connection to a client.
    oifname "wg0" ip daddr @clients ct state established,related accept
    oifname "wg0" ip daddr @clients ct state new drop

    # Management ACLs: admin sources only, and management never initiates across the mesh.
    ip saddr @admin_sources ip daddr @mgmt_destinations ct state new accept
    oifname "wg0" ip saddr @mgmt_destinations ct state new drop
    ip daddr @mgmt_destinations ct state new drop

    # Tier-2 traffic matrix: per site-pair byte/packet counters.
    ip saddr 10.10.0.0/16 ip daddr 10.20.0.0/16 counter name "cnt_site_a_to_site_b"
    ip saddr 10.20.0.0/16 ip daddr 10.10.0.0/16 counter name "cnt_site_b_to_site_a"
    ip saddr 10.20.0.0/16 ip daddr 10.30.0.0/16 counter name "cnt_site_b_to_site_c"
    ip saddr 10.30.0.0/16 ip daddr 10.20.0.0/16 counter name "cnt_site_c_to_site_b"
  }
}
