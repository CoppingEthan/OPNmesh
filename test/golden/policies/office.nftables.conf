  counter c_depot_to_office {}
  counter c_clients_to_office {}
  counter c_office_to_clients {}

  chain forward {
    type filter hook forward priority filter; policy drop;

    # Traffic matrix counters (no verdict).
    ip saddr @lan_office ip daddr @lan_dc counter name "c_office_to_dc"
    ip saddr @lan_dc ip daddr @lan_office counter name "c_dc_to_office"
    ip saddr @lan_office ip daddr @lan_depot counter name "c_office_to_depot"
    ip saddr @lan_depot ip daddr @lan_office counter name "c_depot_to_office"
    ip saddr @clients ip daddr @lan_office counter name "c_clients_to_office"
    ip saddr @lan_office ip daddr @clients counter name "c_office_to_clients"

    ct state established,related accept
    ct state invalid drop

    # Clamp TCP MSS to the tunnel path MTU in both directions.
    oifname "opnmesh0" tcp flags syn tcp option maxseg size set rt mtu
    iifname "opnmesh0" tcp flags syn tcp option maxseg size set rt mtu

    # Nothing opens connections to roaming clients, unless a client allows it.
    oifname "opnmesh0" ip daddr 10.99.1.22 accept
    oifname "opnmesh0" ip daddr @clients ct state new drop

    # This site's LANs to and from every reachable site.
