    iifname "opnmesh0" oifname != "opnmesh0" ip saddr @lan_dc ip daddr @lan_office accept
    iifname != "opnmesh0" oifname "opnmesh0" ip saddr @lan_office ip daddr @lan_depot accept
    iifname "opnmesh0" oifname != "opnmesh0" ip saddr @lan_depot ip daddr @lan_office accept

    # Roaming clients into this site.
    iifname "opnmesh0" oifname != "opnmesh0" ip saddr @clients_open ip daddr @lan_office accept
    iifname "opnmesh0" oifname != "opnmesh0" ip saddr 10.99.1.20 ip daddr @lan_office accept
