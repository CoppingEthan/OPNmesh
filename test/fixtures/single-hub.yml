# Single hub: one UDP port total. site-b and site-c dial site-a; b↔c transits
# the hub, which is a single point of failure (validator must warn loudly).
version: 1
network:
  name: single-hub
topology:
  shape: single-hub
  hubs:
    - site-a
sites:
  - id: site-a
    name: Site A
    lan: 10.10.0.0/16
    gateway:
      lan_ip: 10.10.0.2
      tunnel_ip: 10.99.0.1
      endpoint: 198.51.100.10
      public_key: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa=
  - id: site-b
    name: Site B
    lan: 10.20.0.0/16
    gateway:
      lan_ip: 10.20.0.2
      tunnel_ip: 10.99.0.2
      endpoint: null
      public_key: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb=
  - id: site-c
    name: Site C
    lan: 10.30.0.0/16
    gateway:
      lan_ip: 10.30.0.2
      tunnel_ip: 10.99.0.3
      endpoint: null
      public_key: ccccccccccccccccccccccccccccccccccccccccccc=
clients:
  - id: laptop
    tunnel_ip: 10.99.1.10
    public_key: ddddddddddddddddddddddddddddddddddddddddddd=
    home_site: site-b
