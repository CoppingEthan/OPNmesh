# Multi hub: a and b are hubs, c is capable but not a hub (peers directly with
# everyone capable), d is NAT-bound and dials both hubs. d↔c transits the
# first hub (site-a). Losing one hub must not partition the mesh.
version: 1
network:
  name: multi-hub
topology:
  shape: multi-hub
  hubs:
    - site-a
    - site-b
sites:
  - id: site-a
    name: Site A
    lan: 10.10.0.0/16
    gateway:
      lan_ip: 10.10.0.2
      tunnel_ip: 10.99.0.1
      endpoint: 198.51.100.10
      public_key: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa=
  - id: site-b
    name: Site B
    lan: 10.20.0.0/16
    gateway:
      lan_ip: 10.20.0.2
      tunnel_ip: 10.99.0.2
      endpoint: 198.51.100.20
      public_key: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb=
  - id: site-c
    name: Site C
    lan: 10.30.0.0/16
    gateway:
      lan_ip: 10.30.0.2
      tunnel_ip: 10.99.0.3
      endpoint: 198.51.100.30
      public_key: ccccccccccccccccccccccccccccccccccccccccccc=
  - id: site-d
    name: Site D
    lan: 10.40.0.0/16
    gateway:
      lan_ip: 10.40.0.2
      tunnel_ip: 10.99.0.4
      endpoint: null
      public_key: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee=
clients:
  - id: roam-1
    tunnel_ip: 10.99.1.20
    public_key: fffffffffffffffffffffffffffffffffffffffffff=
    home_site: site-d
