# Non-default ports everywhere (51820 must appear nowhere in generated output),
# a hostname endpoint (exercises reresolve-dns), and a NAT-bound site
# (exercises dynamic endpoints + PersistentKeepalive).
version: 1
network:
  name: custom-ports
  default_listen_port: 48651
  default_mtu: 1380
sites:
  - id: site-a
    name: Site A
    lan: 10.10.0.0/16
    gateway:
      lan_ip: 10.10.0.2
      tunnel_ip: 10.99.0.1
      endpoint: 198.51.100.10
      listen_port: 443
      public_key: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa=
  - id: site-b
    name: Site B
    lan: 10.20.0.0/16
    gateway:
      lan_ip: 10.20.0.2
      tunnel_ip: 10.99.0.2
      endpoint: vpn-b.example.net
      listen_port: 51999
      mtu: 1420
      public_key: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb=
  - id: site-c
    name: Site C
    lan: 10.30.0.0/16
    gateway:
      lan_ip: 10.30.0.2
      tunnel_ip: 10.99.0.3
      endpoint: null
      public_key: ccccccccccccccccccccccccccccccccccccccccccc=
clients:
  - id: roam-1
    tunnel_ip: 10.99.1.20
    public_key: fffffffffffffffffffffffffffffffffffffffffff=
    entry_points:
      - site-b
      - site-a
    home_site: site-c
