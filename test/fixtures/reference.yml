    name: Site A
    lan: 10.10.0.0/16
    gateway:
      name: Gateway A
      lan_ip: 10.10.0.2
      tunnel_ip: 10.99.0.1
      endpoint: 198.51.100.10
      public_key: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa=
  - id: site-b
    name: Site B
    lan: 10.20.0.0/16
    gateway:
      name: Gateway B
      lan_ip: 10.20.0.2
      tunnel_ip: 10.99.0.2
