    lan: 10.30.0.0/16
    gateway:
      name: Gateway C
      lan_ip: 10.30.0.2
      tunnel_ip: 10.99.0.3
      endpoint: 198.51.100.30
      public_key: ccccccccccccccccccccccccccccccccccccccccccc=
clients:
  - id: laptop
    name: Laptop
    tunnel_ip: 10.99.1.10
