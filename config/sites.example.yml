# OPNmesh example configuration.
#
# Copy to sites.yml and adapt. sites.yml is gitignored in THIS repository on
# purpose: it describes your entire network topology and belongs only in the
# local, private config repository OPNmesh maintains on your control node.
#
# Only PUBLIC keys appear here. Private keys are generated on each node and
# never leave it.
version: 1

network:
  name: example
  # Tunnel address space. Gateways get /32s from gateway_subnet, roaming
  # clients from client_subnet.
  gateway_subnet: 10.99.0.0/24
  client_subnet: 10.99.1.0/24
  # Defaults only — every node can override. Nothing in OPNmesh hardcodes a port.
  default_listen_port: 51820
  default_mtu: 1420          # use 1380 on PPPoE links
  keepalive: 25

# Topology shape:
#   full-mesh  — every site can open a UDP port; every pair connects directly.
#   multi-hub  — sites that can open a port are hubs; NAT-bound sites dial every hub.
#   single-hub — one open port total; ALL inter-site traffic depends on that hub.
topology:
  shape: full-mesh

sites:
  # A site with several VLANs — list each one. `role` decides how the mesh
  # treats it:
  #   standard   (default) reachable from every other site
  #   management reachable only from policy.management.admin_sources, and
  #              never allowed to start connections across the mesh
  #   guest      never carried across the mesh at all; stays local to its site
  - id: site-a
    name: Head Office
    lans:
      - cidr: 10.10.10.0/24
        name: Staff
        vlan: 10
      - cidr: 10.10.20.0/24
        name: Voice
        vlan: 20
      - cidr: 10.10.99.0/24
        name: Management
        vlan: 99
        role: management
      - cidr: 192.168.1.0/24
        name: Guest Wi-Fi
        vlan: 90
        role: guest
    gateway:
      name: Head Office Gateway  # display name — cosmetic, never in generated config
      lan_ip: 10.10.10.2         # the gateway's address on its own LAN (router next hop)
      tunnel_ip: 10.99.0.1
      endpoint: 198.51.100.10    # public IP or DDNS hostname; null if no inbound UDP
      listen_port: 51820         # per-node; omit to use default_listen_port
      public_key: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa=

  # A site with one flat network — use the `lan` shorthand instead of `lans`.
  - id: site-b
    name: Branch
    lan: 10.20.0.0/16
    gateway:
      name: Branch Gateway
      lan_ip: 10.20.0.2
      tunnel_ip: 10.99.0.2
      endpoint: 198.51.100.20
      public_key: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb=

  - id: site-c
    name: Warehouse
    lan: 10.30.0.0/16
    gateway:
      name: Warehouse Gateway
      lan_ip: 10.30.0.2
      tunnel_ip: 10.99.0.3
      endpoint: 198.51.100.30
      public_key: ccccccccccccccccccccccccccccccccccccccccccc=

clients:
  - id: laptop
    name: Laptop
    tunnel_ip: 10.99.1.10
    public_key: ddddddddddddddddddddddddddddddddddddddddddd=
    # entry_points: ordered preference of sites whose gateway the client dials.
    # Omit to use every site with an inbound endpoint. Entry point does not
    # limit reach — a client entering at one site reaches every site.
    home_site: site-b          # cosmetic + DNS-level only; any site is allowed

# Management ACLs, generated into every gateway's nftables ruleset: admin
# sources may reach management destinations; nothing else may; and management
# devices never initiate connections across the mesh.
#
# Any LAN with `role: management` is added to management_destinations
# automatically, so you normally only need to list your admin sources here.
policy:
  management:
    admin_sources:
      - 10.10.10.0/24     # the IT subnet
    management_destinations: []
